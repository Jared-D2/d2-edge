# Installed to /etc/NetworkManager/conf.d/ by setup-oob.sh (only when NM
# is present). Without this, NetworkManager treats wwan0 (SIM7600 RNDIS)
# as just another ethernet and can activate an UNPINNED wired profile on
# it — pilot-caught on d2-lab-pi01 2026-08-13: NM applied netplan-eth0 to
# wwan0, eth0 lost its address, and the Pi's default route pointed into
# the (unregistered) modem. Pi stayed reachable only via Tailscale.
# br-oob/veth*/docker0 are included so NM never touches container plumbing.
#
# Note: also worth pinning the wired profile to its device
# (nmcli con modify <profile> connection.interface-name eth0) — but this
# drop-in alone removes the hijack path, since wwan0 is no longer a
# candidate for activation.
[keyfile]
unmanaged-devices=interface-name:wwan0;interface-name:br-oob;interface-name:veth*;interface-name:docker0
