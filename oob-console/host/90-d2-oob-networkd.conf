# Installed to /etc/systemd/networkd.conf.d/ by setup-oob.sh.
# networkd >= v248 defaults to "managing" (DELETING) routing-policy rules
# and routes it doesn't own whenever it reconfigures an interface. That
# silently removes the OOB table-200 ip rule + fail-closed blackhole the
# moment wwan0 comes up — turning fail-closed into fail-OPEN. Pilot-caught
# on d2-lab-pi01 2026-08-13.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
