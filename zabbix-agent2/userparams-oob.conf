# OOB console monitoring — reads the status file oob-watchdog.sh writes
# every 5 min on OOB-enabled Pis. On Pis without OOB the mounted dir is
# empty and the item returns nothing (items land Not Supported — the OOB
# template is only linked to OOB hosts, so that never fires).
# Keys: modem_present at_ok registered csq ping_ok tailnet_online
#       data_used_mb data_cap_mb data_used_pct updated
UserParameter=oob.status[*],grep -s "^$1=" /var/run/d2-oob/status | cut -d= -f2
