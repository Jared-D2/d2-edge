# Pi hardware health — values that have no fixed sysfs path.
#
# pi.undervoltage: 1 if the firmware has flagged under-voltage since the last
# read (raspberrypi-hwmon "rpi_volt" in0_lcrit_alarm), else 0. The hwmonN
# index shifts with what else is fitted (an NVMe drive pushes rpi_volt from
# hwmon3 to hwmon4), so vfs.file.contents cannot address it — hence the glob.
# SoC temperature needs no UserParameter: the template reads
# /host/sys/class/thermal/thermal_zone0/temp directly.
UserParameter=pi.undervoltage,cat /host/sys/devices/platform/soc*/soc*firmware/raspberrypi-hwmon/hwmon/hwmon*/in0_lcrit_alarm 2>/dev/null | head -n1
