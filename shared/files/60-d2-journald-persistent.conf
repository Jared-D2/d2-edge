# Installed by scripts/install-persistent-journal.sh -> /etc/systemd/journald.conf.d/
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-
# storage.conf (Storage=volatile) to spare the SD card, which means every
# kernel/NetworkManager/watchdog line is lost on the reboot that fixes a
# fault. lmc001-hq-pi01 2026-09-19: eth0 stopped transmitting for 26 h, a
# reboot cured it, and no on-box evidence survived to say why. This drop-in
# sorts after 40-* so its Storage= wins.
#
# Volume is small (~6 MB/day measured on d2001-nw-pi01), so the cap below is
# roughly a month of history; journald batches writes (SyncIntervalSec=5m
# default), so SD wear is negligible next to the syslog-proxy local copy.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=1G
MaxFileSec=1week
