// D2 Edge fleet — unattended-upgrades auto-reboot + autoremove policy.
// Installed by shared/scripts/{bootstrap,update}.sh into
// /etc/apt/apt.conf.d/52-d2-auto-reboot. Drop-in (higher number) wins
// over commented-out defaults in /etc/apt/apt.conf.d/50unattended-upgrades.
//
// Rationale: auto-installed kernel security patches need a reboot before
// the running kernel actually picks them up. Without auto-reboot, Wazuh
// keeps flagging the CVE against the still-running old kernel until
// someone manually reboots. Decision documented in
// project_auto_patch_reboot.md (2026-04-14, fleet-wide).
//
// Autoremove (added 2026-05-09): without it, every kernel upgrade leaves
// the previous linux-image-* packages installed forever. Wazuh inventories
// them and flags every old-kernel CVE indefinitely. Cleared ~4,000 stale
// H+C findings across the fleet.
//
// Reboots fire only when /var/run/reboot-required exists at the
// scheduled time, so quiet nights produce no reboot.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "02:00";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";

// Daily unattended runs are SECURITY-ONLY (2026-05-24). The stock
// 50unattended-upgrades on Debian also allows the base `label=Debian`
// origin, which would auto-apply non-security stable updates nightly.
// #clear drops the list 50 built, then we redefine security-only. The
// non-security and third-party (Docker/Tailscale) backlog is instead
// caught by the weekly full-upgrade timer (scripts/weekly-full-upgrade.*)
// every Saturday 01:00. Decision: project_auto_patch_reboot.md.
#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
	"origin=Debian,codename=${distro_codename},label=Debian-Security";
	"origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
};
