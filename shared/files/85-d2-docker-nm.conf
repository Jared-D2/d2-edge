# Installed to /etc/NetworkManager/conf.d/ by the update.sh host heal on
# EVERY Pi where NetworkManager exists (not OOB-gated — this protects
# Docker's container plumbing generally).
#
# Why: NM treats unpinned wired profiles as candidates for ANY
# ethernet-class interface. On the OOB pilot it activated netplan-eth0
# onto a modem interface, dropping eth0's address and default route —
# the same hazard exists for docker0/veth pairs on every fleet Pi after
# an NM package update or profile edit.
#
# Filename sorts BEFORE 90-d2-oob.conf on purpose: NM does NOT merge
# unmanaged-devices across conf.d files — the last-sorted file wins the
# key outright. OOB Pis get the superset (this list + wwan0/br-oob) from
# 90-d2-oob.conf; this file is the fleet baseline.
[keyfile]
unmanaged-devices=interface-name:veth*;interface-name:docker0;interface-name:br-*
